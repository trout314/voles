site_name: voles
site_description: Collocation-method solvers for Volterra integral and integro-differential equations
repo_url: https://github.com/trout314/voles

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            line_length: 88

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - User Guide:
      - Conventions: guide/conventions.md
      - Warnings: guide/warnings.md
      - Migration from 0.10: guide/migration.md
      - Stability policy: guide/stability.md
  - API Reference:
      - Solvers:
          - solve_vie1: api/vie1.md
          - solve_vie2: api/vie2.md
          - solve_vide: api/vide.md
      - VolterraSolution: api/solution.md
      - Warnings: api/warnings.md
      - Helpers:
          - optimal_graded_mesh: api/optimal_graded_mesh.md
          - Collocation node helpers: api/coll_nodes.md
      - Deprecated 0.10 solvers: api/legacy.md
  - Examples:
      - VIE Type 1: examples/vie1.md
      - VIE Type 2: examples/vie2.md
      - VIDE: examples/vide.md
      - Product integration for sampled kernels: examples/product_integration.md
      - Callable inputs and arbitrary meshes: examples/function_solvers.md
      - Vector- and matrix-valued equations: examples/matrix_vector.md
      - Complex-valued equations: examples/complex.md
      - Working with the solution: examples/polynomial_solutions.md
  - Benchmarks: benchmarks.md
